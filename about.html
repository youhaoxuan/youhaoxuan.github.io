  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"ce2b8973-f162-40b9-9350-c8350977ca86\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2aa21fe9-903d-4530-8e7d-e54e12284762\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n  <script src=\"31dcd9b0-d55b-45da-a86a-45cb81dd2a2f\"><\u002Fscript>\n  <style>\n    @keyframes riseIn { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }\n    body { overflow-x: hidden; }\n    a { color: var(--color-accent-700); }\n    a:hover { color: var(--color-accent); }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"scrollbar\" style=\"position:fixed;top:0;left:0;height:3px;width:100%;background:var(--color-accent);z-index:100;transform:scaleX(0);transform-origin:0 50%;will-change:transform;\"><\u002Fdiv>\n\n<div style=\"max-width:1180px;margin:0 auto;padding:0 24px;\">\n  <nav class=\"nav blueprint\" style=\"margin-top:24px;padding:14px 24px;animation:riseIn .7s ease-out both;\">\n    <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n    <div class=\"nav-brand\">Haoxuan You<\u002Fdiv>\n    <a href=\"index.html\">Home<\u002Fa>\n    <a href=\"about.html\" aria-current=\"page\">About<\u002Fa>\n    <a href=\"projects.html\">Projects<\u002Fa>\n    <a href=\"experience.html\">Experience<\u002Fa>\n    <a href=\"mailto:youhx1997@gmail.com\" class=\"btn btn-secondary\" style=\"margin-left:var(--space-4)\">Contact<\u002Fa>\n  <\u002Fnav>\n<\u002Fdiv>\n\n<section style=\"max-width:1180px;margin:0 auto;padding:56px 24px 16px;\">\n  <div class=\"tag tag-outline\" style=\"margin-bottom:12px;\">ABOUT<\u002Fdiv>\n  <h1 style=\"font-size:44px;max-width:20ch;\">Bridging battery R&amp;D and high-volume manufacturing.<\u002Fh1>\n<\u002Fsection>\n\n<section style=\"max-width:1180px;margin:0 auto;padding:40px 24px 24px;\">\n  <h3 data-reveal=\"\" style=\"opacity:0;transform:translate3d(0,20px,0);transition:opacity .7s ease, transform .7s ease;font-size:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text);opacity:0.6;margin-bottom:28px;\">Journey<\u002Fh3>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;position:relative;\">\n\n    <div data-reveal=\"\" data-delay=\"0\" style=\"opacity:0;transform:translate3d(0,28px,0);transition:opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1);padding:0 16px 0 0;\">\n      <div style=\"display:flex;align-items:center;gap:0;margin-bottom:18px;\">\n        <span style=\"width:11px;height:11px;border:1.5px solid var(--color-accent-700);flex:none;\"><\u002Fspan>\n        <span style=\"flex:1;height:1px;background:var(--color-divider);\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:13px;letter-spacing:0.08em;color:var(--color-accent-700);margin-bottom:6px;\">2015 — 2019<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin-bottom:4px;\">University of Iowa<\u002Fdiv>\n      <div style=\"font-size:13px;opacity:0.7;line-height:1.5;\">B.S. Mechanical Engineering<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" data-delay=\"0.1\" style=\"opacity:0;transform:translate3d(0,28px,0);transition:opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1);padding:0 16px 0 0;\">\n      <div style=\"display:flex;align-items:center;gap:0;margin-bottom:18px;\">\n        <span style=\"width:11px;height:11px;border:1.5px solid var(--color-accent-700);flex:none;\"><\u002Fspan>\n        <span style=\"flex:1;height:1px;background:var(--color-divider);\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:13px;letter-spacing:0.08em;color:var(--color-accent-700);margin-bottom:6px;\">2019 — 2021<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin-bottom:4px;\">Purdue University<\u002Fdiv>\n      <div style=\"font-size:13px;opacity:0.7;line-height:1.5;\">M.S. Mechanical Engineering · Laser AM research<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" data-delay=\"0.2\" style=\"opacity:0;transform:translate3d(0,28px,0);transition:opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1);padding:0 16px 0 0;\">\n      <div style=\"display:flex;align-items:center;gap:0;margin-bottom:18px;\">\n        <span style=\"width:11px;height:11px;border:1.5px solid var(--color-accent-700);flex:none;\"><\u002Fspan>\n        <span style=\"flex:1;height:1px;background:var(--color-divider);\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:13px;letter-spacing:0.08em;color:var(--color-accent-700);margin-bottom:6px;\">2021 — 2022<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin-bottom:4px;\">Sakuu<\u002Fdiv>\n      <div style=\"font-size:13px;opacity:0.7;line-height:1.5;\">Solid-state assembly &amp; fixtures<\u002Fdiv>\n      <span class=\"tag tag-neutral\" style=\"margin-top:10px;display:inline-block;\">R&amp;D<\u002Fspan>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" data-delay=\"0.3\" style=\"opacity:0;transform:translate3d(0,28px,0);transition:opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1);padding:0 16px 0 0;\">\n      <div style=\"display:flex;align-items:center;gap:0;margin-bottom:18px;\">\n        <span style=\"width:11px;height:11px;border:1.5px solid var(--color-accent-700);flex:none;\"><\u002Fspan>\n        <span style=\"flex:1;height:1px;background:var(--color-divider);\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:13px;letter-spacing:0.08em;color:var(--color-accent-700);margin-bottom:6px;\">2022 — 2025<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin-bottom:4px;\">Lyten<\u002Fdiv>\n      <div style=\"font-size:13px;opacity:0.7;line-height:1.5;\">Associate → Senior Battery Engineer · Li-S &amp; Li-metal<\u002Fdiv>\n      <span class=\"tag tag-neutral\" style=\"margin-top:10px;display:inline-block;\">R&amp;D → Pilot<\u002Fspan>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" data-delay=\"0.4\" style=\"opacity:0;transform:translate3d(0,28px,0);transition:opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1);\">\n      <div style=\"display:flex;align-items:center;gap:0;margin-bottom:18px;\">\n        <span style=\"width:11px;height:11px;background:var(--color-accent);flex:none;\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:13px;letter-spacing:0.08em;color:var(--color-accent-700);margin-bottom:6px;\">2025 — PRESENT<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:19px;line-height:1.2;margin-bottom:4px;\">Tesla<\u002Fdiv>\n      <div style=\"font-size:13px;opacity:0.7;line-height:1.5;\">Process Engineer, LFP Cell Manufacturing<\u002Fdiv>\n      <span class=\"tag tag-accent\" style=\"margin-top:10px;display:inline-block;\">High-Volume<\u002Fspan>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width:1180px;margin:0 auto;padding:32px 24px 56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px;align-items:start;\">\n  <div class=\"blueprint\" style=\"padding:16px;position:sticky;top:24px;\">\n    <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n    \n    <img src=\"617a5ad2-ee49-4106-9d10-8c05b7b657c4\" style=\"width:100%;height:420px;object-fit:cover;object-position:center 25%;display:block;\" alt=\"Haoxuan You\"><div style=\"margin-top:16px;font-size:13px;line-height:1.9;opacity:0.8;\">\n      <div><strong>Location<\u002Fstrong> · Sparks, NV<\u002Fdiv>\n      <div><strong>Email<\u002Fstrong> · youhx1997@gmail.com<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <p style=\"font-size:17px;line-height:1.7;margin-bottom:20px;\">\n      I'm a mechanical and cell design engineer with six years spanning battery R&amp;D, mechanical design, and high-volume manufacturing for next-generation lithium systems. My work sits at the intersection of electrochemistry, mechanical design, and production — I care as much about a cell's failure modes as I do about the process window that keeps yield stable at scale.\n    <\u002Fp>\n    <p style=\"font-size:17px;line-height:1.7;margin-bottom:32px;\">\n      At Tesla I develop and optimize high-volume LFP cell-assembly processes — establishing in-line SPC across stacking, compression, and welding, and driving first-pass yield, OEE, and throughput for 24/7 production. Before Tesla, I led cell-level mechanical design and manufacturing scale-up at Lyten (including a 100× increase in lithium-metal foil throughput), running DOE-based validation and building Python/JMP automation for SPC and reliability data. I'm most energized where a materials-level decision and a manufacturing constraint collide.\n    <\u002Fp>\n\n    <h3 data-reveal=\"\" style=\"opacity:0;transform:translate3d(0,32px,0);transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1);font-size:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text);opacity:0.6;margin-bottom:14px;\">Focus Areas<\u002Fh3>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:36px;\">\n      <span class=\"tag tag-accent\">Cell Mechanical Design &amp; GD&amp;T<\u002Fspan>\n      <span class=\"tag tag-accent\">Manufacturing Scale-Up &amp; DFM<\u002Fspan>\n      <span class=\"tag tag-accent\">Process Control (SPC / MSA)<\u002Fspan>\n      <span class=\"tag tag-accent\">DOE &amp; Validation<\u002Fspan>\n      <span class=\"tag tag-accent\">FMEA &amp; Root-Cause (8D)<\u002Fspan>\n      <span class=\"tag tag-accent\">Reliability &amp; Failure Analysis<\u002Fspan>\n    <\u002Fdiv>\n\n    <h3 data-reveal=\"\" style=\"opacity:0;transform:translate3d(0,32px,0);transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1);font-size:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text);opacity:0.6;margin-bottom:14px;\">Skills<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-bottom:36px;\">\n      <div data-reveal=\"\" data-delay=\"0.00\" class=\"blueprint\" style=\"padding:16px;opacity:0;transform:translate3d(0,32px,0);transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1);\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div class=\"card-title\" style=\"margin-bottom:8px;\">Mechanical Design<\u002Fdiv>\n        <p class=\"card-body\" style=\"opacity:0.75;\">GD&amp;T, tolerance stack-up, DFM, DFMEA, fixture &amp; module design, FEA (ANSYS, Abaqus), SolidWorks (CSWP)<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-delay=\"0.09\" class=\"blueprint\" style=\"padding:16px;opacity:0;transform:translate3d(0,32px,0);transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1);\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div class=\"card-title\" style=\"margin-bottom:8px;\">Manufacturing &amp; Process<\u002Fdiv>\n        <p class=\"card-body\" style=\"opacity:0.75;\">High-volume process development, SPC/MSA, PFMEA, Cp/Cpk &amp; GR&amp;R, DMAIC/Kaizen, OEE, MES, control plans; coating, calendering, lamination, extrusion/rolling<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-delay=\"0.18\" class=\"blueprint\" style=\"padding:16px;opacity:0;transform:translate3d(0,32px,0);transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1);\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div class=\"card-title\" style=\"margin-bottom:8px;\">Testing &amp; Characterization<\u002Fdiv>\n        <p class=\"card-body\" style=\"opacity:0.75;\">EIS, CV, GITT, PITT; cyclers (Arbin, MACCOR, Neware, BioLogic); mechanical load, pressure mapping, SEM/EBSD, XRD<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-delay=\"0.27\" class=\"blueprint\" style=\"padding:16px;opacity:0;transform:translate3d(0,32px,0);transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1);\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div class=\"card-title\" style=\"margin-bottom:8px;\">Data &amp; Automation<\u002Fdiv>\n        <p class=\"card-body\" style=\"opacity:0.75;\">Python, MATLAB, SQL, R, LabVIEW, C/C++; JMP, Tableau, ImageJ; DOE &amp; SPC dashboards<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 data-reveal=\"\" style=\"opacity:0;transform:translate3d(0,32px,0);transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1);font-size:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text);opacity:0.6;margin-bottom:14px;\">Education<\u002Fh3>\n    <sc-raw-table class=\"table\" style=\"margin-bottom:36px;\">\n      <sc-raw-tbody>\n        <sc-raw-tr>\n          <sc-raw-td style=\"font-weight:500;\">M.S., Mechanical Engineering<\u002Fsc-raw-td>\n          <sc-raw-td class=\"text-muted\">Purdue University, 2021<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"font-weight:500;\">B.S., Mechanical Engineering<\u002Fsc-raw-td>\n          <sc-raw-td class=\"text-muted\">University of Iowa, 2019<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h3 data-reveal=\"\" style=\"opacity:0;transform:translate3d(0,32px,0);transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1);font-size:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text);opacity:0.6;margin-bottom:14px;\">Patents<\u002Fh3>\n    <ul style=\"margin:0 0 32px;padding-left:18px;font-size:14px;line-height:1.7;opacity:0.85;\">\n      <li>Hybrid Gel Polymer Electrolytes and Catholytes for Lithium-Sulfur Batteries — WO2024118412A1 (Lyten, Inc.)<\u002Fli>\n      <li>Lithium-Sulfur Batteries — WO2025085743A1 (Lyten, Inc.)<\u002Fli>\n      <li>Lithium-Alloy Anodes for Lithium-Sulfur Batteries — WO2024259126A3 (Lyten, Inc.)<\u002Fli>\n    <\u002Ful>\n\n    <h3 data-reveal=\"\" style=\"opacity:0;transform:translate3d(0,32px,0);transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1);font-size:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text);opacity:0.6;margin-bottom:14px;\">Selected Publications<\u002Fh3>\n    <ul style=\"margin:0 0 12px;padding-left:18px;font-size:14px;line-height:1.7;opacity:0.85;\">\n      <li>Zhu, Y., You, H., et al. (2025). 3D Composite Anode Enables the Long Cycle Life of Li-S Batteries. 247th ECS Meeting, Montréal.<\u002Fli>\n      <li>Meng, Y., You, H., et al. (2025). Anode Design Strategies for High Energy Li-S Batteries. 247th ECS Meeting, Montréal.<\u002Fli>\n      <li>Liu, W., You, H., et al. (2021). Double-pulse laser micro sintering. Journal of Manufacturing Processes.<\u002Fli>\n    <\u002Ful>\n    <a href=\"https://scholar.google.com/citations?user=OTi3fYYAAAAJ&amp;hl=en\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-ghost\" style=\"padding-inline:0;\">Full list on Google Scholar →<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"max-width:1180px;margin:0 auto;border-top:1px solid var(--color-divider);padding:32px 24px 48px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;\">\n  <div style=\"font-size:13px;opacity:0.6;\">© 2026 Haoxuan You — Cell &amp; Process Engineer<\u002Fdiv>\n  <div style=\"display:flex;gap:20px;flex-wrap:wrap;\">\n    <a href=\"mailto:youhx1997@gmail.com\">Email<\u002Fa>\n    <a href=\"https://scholar.google.com/citations?user=OTi3fYYAAAAJ&amp;hl=en\" target=\"_blank\" rel=\"noopener\">Google Scholar ↗<\u002Fa>\n    <a href=\"https://www.linkedin.com/in/youhaoxuan/\" target=\"_blank\" rel=\"noopener\">LinkedIn ↗<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n    this.raf = null;\n    requestAnimationFrame(() => { this.bar = document.getElementById('scrollbar'); this.measure(); this.setupReveals(); this.setupScrollBar(); });\n    this._onResize = () => { clearTimeout(this._rzT); this._rzT = setTimeout(() => this.measure(), 150); };\n    window.addEventListener('resize', this._onResize);\n  }\n\n  componentWillUnmount() {\n    if (this.io) this.io.disconnect();\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._onResize) window.removeEventListener('resize', this._onResize);\n    if (this.raf) cancelAnimationFrame(this.raf);\n    clearTimeout(this._rzT);\n  }\n\n  measure() {\n    this.docMax = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);\n  }\n\n  show(el) {\n    el.style.opacity = '1';\n    el.style.transform = 'none';\n    setTimeout(() => { el.style.willChange = 'auto'; }, 900);\n  }\n\n  setupReveals() {\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    if (!els.length) return;\n    if (this.reduced || !('IntersectionObserver' in window)) { els.forEach((el) => this.show(el)); return; }\n    this.io = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        if (!entry.isIntersecting) return;\n        const el = entry.target;\n        el.style.willChange = 'opacity, transform';\n        const delay = parseFloat(el.getAttribute('data-delay') || '0') * 1000;\n        setTimeout(() => this.show(el), delay);\n        this.io.unobserve(el);\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -5% 0px' });\n    els.forEach((el) => this.io.observe(el));\n    setTimeout(() => {\n      els.forEach((el) => {\n        if (el.style.opacity !== '1' && el.getBoundingClientRect().top < window.innerHeight) this.show(el);\n      });\n      this.measure();\n    }, 2000);\n  }\n\n  setupScrollBar() {\n    if (!this.bar || this.reduced) return;\n    this._onScroll = () => {\n      if (this.raf) return;\n      this.raf = requestAnimationFrame(() => {\n        this.raf = null;\n        const p = this.docMax > 0 ? Math.min(1, (window.scrollY || 0) / this.docMax) : 0;\n        this.bar.style.transform = 'scaleX(' + p.toFixed(4) + ')';\n      });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n  }\n\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
